<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无职转生 · 魔法图谱 — Arcane Codex</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:wght@300;500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   ARCANE CODEX  ·  Aesthetic Foundation
   ═══════════════════════════════════════════ */
:root{
  --void:#080a14; --abyss:#0d1025; --ink:#151935; --rune:#1c2244;
  --gold:#c9a961; --gold-bright:#f0d48a; --gold-dim:#8a7240;
  --arcane:#7c3aed; --arcane-dim:#4a1e99;
  --mana:#4fc3f7; --mana-dim:#1a6d91;
  --blood:#dc2626; --blood-dim:#7f1d1d;
  --life:#22c55e; --life-dim:#15803d;
  --ember:#f97316; --ember-dim:#9a3412;
  --soul:#ec4899; --soul-dim:#9d174d;
  --frost:#67e8f9; --frost-dim:#0e7490;
  --paper:#f5e6c8; --ink-text:#e8dcc8;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Cormorant Garamond','ZCOOL XiaoWei',serif;color:var(--ink-text);background:var(--void)}
::selection{background:var(--gold);color:var(--void)}

/* ── Background layers ── */
#bg-void{position:fixed;inset:0;background:
  radial-gradient(ellipse 120% 100% at 50% 50%,rgba(124,58,237,.06) 0%,transparent 60%),
  radial-gradient(ellipse 80% 80% at 30% 20%,rgba(79,195,247,.04) 0%,transparent 50%),
  radial-gradient(ellipse 100% 80% at 70% 80%,rgba(201,169,97,.03) 0%,transparent 50%),
  var(--void);
}
#bg-grain{position:fixed;inset:0;opacity:.03;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
#bg-symbols{position:fixed;inset:0;opacity:.015;pointer-events:none;}

/* ── Top Bar ── */
#topbar{
  position:fixed;top:0;left:0;right:0;height:64px;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;
  background:linear-gradient(180deg,rgba(8,10,20,.92) 0%,rgba(8,10,20,.4) 80%,transparent 100%);
  backdrop-filter:blur(8px);
}
#topbar .brand{display:flex;align-items:center;gap:14px}
#topbar .sigil{
  width:38px;height:38px;border:1.5px solid var(--gold-dim);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,rgba(201,169,97,.15),transparent);
  box-shadow:0 0 20px rgba(201,169,97,.2),inset 0 0 10px rgba(201,169,97,.1);
  animation:sigil-pulse 4s ease-in-out infinite;
}
@keyframes sigil-pulse{0%,100%{box-shadow:0 0 15px rgba(201,169,97,.15)}50%{box-shadow:0 0 25px rgba(201,169,97,.35),inset 0 0 15px rgba(201,169,97,.15)}}
#topbar h1{font-family:'Cinzel',serif;font-weight:700;font-size:18px;color:var(--gold-bright);letter-spacing:2px;text-shadow:0 0 30px rgba(201,169,97,.3)}
#topbar .latin{font-family:'Cinzel',serif;font-size:10px;color:var(--gold-dim);letter-spacing:3px;text-transform:uppercase}
#topbar .stats{display:flex;align-items:center;gap:24px;font-size:12px;color:var(--gold-dim)}
#topbar .stats span b{color:var(--gold-bright);font-size:16px;font-family:'Cinzel',serif;margin-right:4px}

/* ── Search (prominent) ── */
#search-area{
  position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:15;
  width:440px;max-width:60vw;
}
#search{
  width:100%;padding:10px 16px 10px 44px;border-radius:30px;
  border:1px solid rgba(201,169,97,.2);background:rgba(13,16,37,.8);
  backdrop-filter:blur(16px);color:var(--paper);font-size:15px;outline:none;
  font-family:'Cormorant Garamond',serif;letter-spacing:.5px;
  transition:all .3s cubic-bezier(.4,0,.2,1);
}
#search::placeholder{color:var(--gold-dim);opacity:.6;font-style:italic}
#search:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,169,97,.1),0 0 40px rgba(201,169,97,.08)}
#search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--gold);opacity:.7;font-size:14px}

/* ── Filter Bar (icon-only, bottom-right corner orb) ── */
#filters{
  position:fixed;bottom:28px;right:28px;display:flex;flex-direction:column;gap:8px;z-index:15;
}
.filter-btn{
  width:40px;height:40px;border-radius:50%;cursor:pointer;
  border:1px solid rgba(201,169,97,.15);background:rgba(13,16,37,.85);
  backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;
  font-size:18px;transition:all .3s;position:relative;
}
.filter-btn:hover{transform:scale(1.1);border-color:currentColor}
.filter-btn.active{box-shadow:0 0 15px rgba(255,255,255,.1)}
.filter-btn[data-k="character"]{color:var(--gold)}
.filter-btn[data-k="location"]{color:var(--life)}
.filter-btn[data-k="family"]{color:var(--arcane)}
.filter-btn[data-k="event"]{color:var(--blood)}
.filter-btn[data-k="skill"]{color:var(--ember)}
.filter-btn[data-k="artifact"]{color:var(--frost)}
.filter-btn[data-k="theme"]{color:var(--soul)}
.filter-btn::after{
  content:attr(data-name);position:absolute;right:50px;top:50%;transform:translateY(-50%);
  background:rgba(13,16,37,.95);border:1px solid rgba(201,169,97,.2);border-radius:8px;
  padding:4px 10px;font-size:11px;color:var(--paper);white-space:nowrap;opacity:0;
  pointer-events:none;transition:opacity .2s,right .2s;font-family:'Cinzel',serif;letter-spacing:1px;
}
.filter-btn:hover::after{opacity:1;right:56px}

/* ── Controls ── */
#controls{position:fixed;bottom:28px;left:28px;display:flex;flex-direction:column;gap:6px;z-index:15}
.ctrl{
  width:36px;height:36px;border-radius:50%;cursor:pointer;
  border:1px solid rgba(201,169,97,.12);background:rgba(13,16,37,.7);
  backdrop-filter:blur(10px);color:var(--gold-dim);font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.ctrl:hover{color:var(--gold);background:rgba(201,169,97,.08)}

/* ── Right Side Panel ── */
#panel{
  position:fixed;top:0;right:-420px;width:400px;height:100%;z-index:25;
  background:linear-gradient(180deg,rgba(13,16,37,.97) 0%,rgba(8,10,20,.98) 100%);
  backdrop-filter:blur(30px);
  border-left:1px solid rgba(201,169,97,.12);
  padding:28px 28px 28px;transition:right .45s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;
}
#panel.open{right:0}
#panel .close-btn{
  position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:50%;
  border:1px solid rgba(201,169,97,.15);background:rgba(201,169,97,.05);
  color:var(--gold);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
#panel .close-btn:hover{background:rgba(201,169,97,.15);transform:rotate(90deg)}
#panel .ornament{display:flex;align-items:center;gap:12px;margin-bottom:18px;opacity:.3}
#panel .ornament::before,#panel .ornament::after{content:'';flex:1;height:1px;background:var(--gold-dim)}

#panel .kind-orb{
  width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:24px;margin:0 auto 16px;box-shadow:0 0 30px currentColor,inset 0 0 15px rgba(0,0,0,.4);
  border:2px solid rgba(255,255,255,.1);position:relative;
}
#panel .kind-orb::after{
  content:'';position:absolute;inset:-6px;border-radius:50%;border:1px solid currentColor;opacity:.2;
  animation:sigil-pulse 3s ease-in-out infinite;
}
#panel h2{font-family:'Cinzel',serif;font-size:24px;font-weight:700;color:var(--gold-bright);text-align:center;margin-bottom:4px;text-shadow:0 0 20px rgba(201,169,97,.3)}
#panel .latin-name{font-size:12px;color:var(--gold-dim);text-align:center;letter-spacing:2px;text-transform:uppercase;margin-bottom:20px}
#panel .weight-ring{
  width:80px;height:80px;margin:0 auto 24px;position:relative;
}
#panel .weight-ring svg{transform:rotate(-90deg)}
#panel .weight-ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-size:18px;color:var(--gold-bright)}

/* Relationships in panel */
#panel .section-title{font-family:'Cinzel',serif;font-size:11px;color:var(--gold-dim);letter-spacing:2px;text-transform:uppercase;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(201,169,97,.1)}
#panel .rel-group{margin-bottom:14px}
#panel .rel-group-title{font-size:11px;color:var(--gold-dim);margin-bottom:6px;letter-spacing:1px}
#panel .rel-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
  margin-bottom:4px;cursor:pointer;transition:all .15s;
  border:1px solid transparent;
}
#panel .rel-item:hover{background:rgba(201,169,97,.06);border-color:rgba(201,169,97,.1)}
#panel .rel-item .mini-orb{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;
  background:radial-gradient(circle,rgba(255,255,255,.1),transparent);
}
#panel .rel-item .rel-text{flex:1;font-size:13px;color:var(--ink-text)}
#panel .rel-item .rel-type{font-size:10px;color:var(--gold-dim);font-style:italic}

/* ── Tooltip ── */
#tooltip{
  position:fixed;padding:8px 14px;border-radius:10px;font-size:13px;pointer-events:none;
  background:rgba(8,10,20,.96);border:1px solid rgba(201,169,97,.2);
  backdrop-filter:blur(12px);opacity:0;transition:opacity .2s;z-index:30;
  box-shadow:0 4px 20px rgba(0,0,0,.4);font-family:'Cormorant Garamond',serif;
}
#tooltip .ttl{color:var(--gold-bright);font-weight:600}
#tooltip .cat{color:var(--gold-dim);font-size:10px;letter-spacing:1px}

/* ── Loading ── */
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--void);z-index:50;transition:opacity .6s}
#loading.hide{opacity:0;pointer-events:none}
#loading .orb{
  width:60px;height:60px;border:2px solid var(--gold-dim);border-top-color:var(--gold);border-radius:50%;
  animation:spin 1.2s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{margin-top:20px;font-family:'Cinzel',serif;color:var(--gold);letter-spacing:3px;font-size:13px;}

/* ── SVG ── */
svg{position:fixed;inset:0;width:100%;height:100%}

/* Scrollbar (panel only) */
#panel::-webkit-scrollbar{width:3px}
#panel::-webkit-scrollbar-track{background:transparent}
#panel::-webkit-scrollbar-thumb{background:rgba(201,169,97,.2);border-radius:3px}
</style>
</head>
<body>

<div id="bg-void"></div>
<div id="bg-grain"></div>
<div id="bg-symbols"></div>

<svg><defs>
  <filter id="glow-gold"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glow-life"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glow-arcane"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glow-blood"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glow-ember"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glow-frost"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glow-soul"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glow-soft"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="node-grad-gold" cx="40%" cy="35%"><stop offset="0%" stop-color="#f7e6b8"/><stop offset="100%" stop-color="#c9a961"/></radialGradient>
  <radialGradient id="node-grad-life" cx="40%" cy="35%"><stop offset="0%" stop-color="#86efac"/><stop offset="100%" stop-color="#16a34a"/></radialGradient>
  <radialGradient id="node-grad-arcane" cx="40%" cy="35%"><stop offset="0%" stop-color="#c4b5fd"/><stop offset="100%" stop-color="#6d28d9"/></radialGradient>
  <radialGradient id="node-grad-blood" cx="40%" cy="35%"><stop offset="0%" stop-color="#fca5a5"/><stop offset="100%" stop-color="#dc2626"/></radialGradient>
  <radialGradient id="node-grad-ember" cx="40%" cy="35%"><stop offset="0%" stop-color="#fed7aa"/><stop offset="100%" stop-color="#ea580c"/></radialGradient>
  <radialGradient id="node-grad-frost" cx="40%" cy="35%"><stop offset="0%" stop-color="#a5f3fc"/><stop offset="100%" stop-color="#0891b2"/></radialGradient>
  <radialGradient id="node-grad-soul" cx="40%" cy="35%"><stop offset="0%" stop-color="#fbcfe8"/><stop offset="100%" stop-color="#db2777"/></radialGradient>
  <pattern id="arcane-circle" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
    <circle cx="100" cy="100" r="98" fill="none" stroke="#c9a961" stroke-width=".3" opacity=".15"/>
    <circle cx="100" cy="100" r="80" fill="none" stroke="#c9a961" stroke-width=".2" opacity=".1"/>
    <line x1="0" y1="100" x2="200" y2="100" stroke="#c9a961" stroke-width=".15" opacity=".08"/>
    <line x1="100" y1="0" x2="100" y2="200" stroke="#c9a961" stroke-width=".15" opacity=".08"/>
  </pattern>
</defs>
<rect width="100%" height="100%" fill="url(#arcane-circle)"/>
</svg>

<!-- UI -->
<div id="topbar">
  <div class="brand">
    <div class="sigil">⚜</div>
    <div>
      <h1>无职转生</h1>
      <div class="latin">Mushoku Tensei · Codex Arcanum</div>
    </div>
  </div>
  <div class="stats">
    <span><b id="s-nodes">0</b>ENTITAS</span>
    <span><b id="s-edges">0</b>NEXUS</span>
    <span><b id="s-types">0</b>ORDO</span>
  </div>
</div>

<div id="search-area">
  <span id="search-icon">⌖</span>
  <input id="search" placeholder="Search entities... (角色·地点·家族)" autocomplete="off">
</div>

<div id="controls">
  <div class="ctrl" onclick="zoomIn()" title="Magnify">⊕</div>
  <div class="ctrl" onclick="zoomOut()" title="Minimize">⊖</div>
  <div class="ctrl" onclick="resetView()" title="Reset Orrery">⊙</div>
  <div class="ctrl" onclick="togglePhysics()" title="Toggle Ether">✦</div>
</div>

<div id="filters">
  <div class="filter-btn active" data-k="character" data-name="CHARACTER" title="Character">◈</div>
  <div class="filter-btn active" data-k="location" data-name="LOCATION" title="Location">◉</div>
  <div class="filter-btn active" data-k="family" data-name="HOUSE" title="House">◆</div>
  <div class="filter-btn active" data-k="event" data-name="EVENT" title="Event">✧</div>
  <div class="filter-btn active" data-k="skill" data-name="ARTE" title="Skill">⟐</div>
  <div class="filter-btn active" data-k="artifact" data-name="ARTIFACT" title="Artifact">◇</div>
  <div class="filter-btn active" data-k="theme" data-name="THEMA" title="Theme">❖</div>
</div>

<!-- Detail Panel -->
<div id="panel">
  <button class="close-btn" onclick="closePanel()">✕</button>
  <div id="panel-c"></div>
</div>

<!-- Tooltip -->
<div id="tooltip"></div>

<!-- Loading -->
<div id="loading"><div class="orb"></div><p>INVOCATING GRAPHIUM...</p></div>

<script>
// ═══════════════════════════════════════
//  ARCANE CODEX  ·  Engine
// ═══════════════════════════════════════
const C = {
  character:['#c9a961','#f0d48a','url(#node-grad-gold)','glow-gold','◈'],
  location:['#22c55e','#86efac','url(#node-grad-life)','glow-life','◉'],
  family:['#7c3aed','#a78bfa','url(#node-grad-arcane)','glow-arcane','◆'],
  event:['#dc2626','#fca5a5','url(#node-grad-blood)','glow-blood','✧'],
  skill:['#f97316','#fed7aa','url(#node-grad-ember)','glow-ember','⟐'],
  artifact:['#06b6d4','#67e8f9','url(#node-grad-frost)','glow-frost','◇'],
  theme:['#ec4899','#fbcfe8','url(#node-grad-soul)','glow-soul','❖']
};
const KIND = {character:'Character',location:'Location',house:'House',event:'Arcanum',skill:'Ars',artifact:'Artefactum',theme:'Thema'};
const svg = d3.select('svg');
const W = ()=>window.innerWidth, H = ()=>window.innerHeight;

let g, sim, zoom, link, nodeG, linkLabel;
let nodes = [], links = [];
let activeK = new Set(['character','location','family','event','skill','artifact','theme']);
let physicsOn = true;

// ── Init SVG groups ──
function initGraph(){
  svg.selectAll('.graph').remove();
  g = svg.append('g').attr('class','graph');
  const defs = svg.select('defs');

  // Arrow markers per color
  Object.entries(C).forEach(([k,[c]])=>{
    defs.append('marker').attr('id','arrow-'+k).attr('viewBox','0 -5 10 10').attr('refX',22).attr('refY',0)
      .attr('markerWidth',7).attr('markerHeight',7).attr('orient','auto')
      .append('path').attr('d','M0,-4L8,0L0,4').attr('fill',c).attr('opacity',.5);
  });

  zoom = d3.zoom().scaleExtent([.15,4]).on('zoom',e=>g.attr('transform',e.transform));
  svg.call(zoom);
  svg.on('click',e=>{if(e.target.tagName==='svg'||e.target.tagName==='rect')closePanel()});

  const linkLayer = g.append('g').attr('class','links');
  const labelLayer = g.append('g').attr('class','link-labels');
  const nodeLayer = g.append('g').attr('class','nodes');

  link = linkLayer.selectAll('path');
  linkLabel = labelLayer.selectAll('text');
  nodeG = nodeLayer.selectAll('g');
}

// ── Render ──
function render(){
  const vn = nodes.filter(n=>activeK.has(n.kind));
  const vids = new Set(vn.map(n=>n.id));
  const vl = links.filter(l=>vids.has(l.source.id||l.source)&&vids.has(l.target.id||l.target));

  sim = d3.forceSimulation(vn)
    .force('link',d3.forceLink(vl).id(d=>d.id).distance(d=>{
      const w = (d.source.weight||1)+(d.target.weight||1);
      return 90 + (20-Math.min(w,20))*3;
    }).strength(.35))
    .force('charge',d3.forceManyBody().strength(-280))
    .force('center',d3.forceCenter(W()/2,H()/2).strength(.04))
    .force('collide',d3.forceCollide().radius(d=>nr(d)+12))
    .force('x',d3.forceX(W()/2).strength(.02))
    .force('y',d3.forceY(H()/2).strength(.02));

  // Edges
  link = link.data(vl,d=>d.source.id+'-'+d.target.id).join(
    enter=>enter.append('path').attr('class','edge'),
    update=>update,
    exit=>exit.remove()
  );
  link.attr('fill','none')
    .attr('stroke',d=>{
      const k = d.source.kind||'character';
      const c = C[k]||C.character;
      return c[1];
    })
    .attr('stroke-opacity',d=>.2+.15*(d.weight||1)/10)
    .attr('stroke-width',d=>.8+Math.min((d.weight||1)/4,2.5))
    .attr('stroke-linecap','round')
    .attr('marker-end',d=>`url(#arrow-${d.source.kind||'character'})`);

  // Edge labels (only show on hover)
  linkLabel = linkLabel.data(vl,d=>d.source.id+'-'+d.target.id).join('text')
    .attr('class','edge-lbl')
    .attr('text-anchor','middle')
    .attr('fill','#c9a961')
    .attr('font-size','9px')
    .attr('opacity',0)
    .attr('pointer-events','none')
    .text(d=>d.relation);

  // Nodes
  nodeG = nodeG.data(vn,d=>d.id).join(
    enter=>{
      const grp = enter.append('g').attr('class','node');
      // Outer glow ring
      grp.append('circle').attr('class','n-glow')
        .attr('r',d=>nr(d)+6)
        .attr('fill','none')
        .attr('stroke',d=>C[d.kind]?C[d.kind][1]:'#666')
        .attr('stroke-width',1)
        .attr('stroke-opacity',.15)
        .attr('filter',d=>`url(#${C[d.kind]?C[d.kind][3]:'glow-soft'})`);
      // Main circle
      grp.append('circle').attr('class','n-main')
        .attr('r',d=>nr(d))
        .attr('fill',d=>C[d.kind]?C[d.kind][2]:'#666')
        .attr('stroke',d=>C[d.kind]?C[d.kind][0]:'#888')
        .attr('stroke-width',1.5)
        .attr('stroke-opacity',.8)
        .attr('filter',d=>`url(#${C[d.kind]?C[d.kind][3]:'glow-soft'})`)
        .style('cursor','pointer');
      // Sigil character
      grp.append('text').attr('class','n-sigil')
        .attr('text-anchor','middle')
        .attr('dy','0.35em')
        .attr('font-size',d=>nr(d)*0.9)
        .attr('fill','rgba(0,0,0,.4)')
        .attr('pointer-events','none')
        .text(d=>C[d.kind]?C[d.kind][4]:'●');
      // Label
      grp.append('text').attr('class','n-label')
        .attr('text-anchor','middle')
        .attr('dy',d=>nr(d)+16)
        .attr('font-size',d=>d.weight>7?13:d.weight>4?11:10)
        .attr('fill','#e8dcc8')
        .attr('font-weight',d=>d.weight>7?700:400)
        .attr('pointer-events','none')
        .attr('opacity',.75)
        .text(d=>d.label.length>6?d.label.slice(0,5)+'…':d.label);
      return grp;
    },
    update=>update,
    exit=>exit.remove()
  );

  nodeG.select('.n-main')
    .on('click',(e,d)=>{e.stopPropagation();openPanel(d)})
    .on('mouseenter',(e,d)=>highlight(d))
    .on('mouseleave',clearHL)
    .on('mousemove',(e,d)=>{showTip(e,d.label,KIND[d.kind]||d.kind)})
    .on('mouseout',hideTip);

  sim.on('tick',()=>{
    link.attr('d',d=>{
      const dx=d.target.x-d.source.x, dy=d.target.y-d.source.y;
      const dr=Math.sqrt(dx*dx+dy*dy)*2;
      return `M${d.source.x},${d.source.y}A${dr},${dr} 0 0,1 ${d.target.x},${d.target.y}`;
    });
    linkLabel.attr('x',d=>(d.source.x+d.target.x)/2).attr('y',d=>(d.source.y+d.target.y)/2-4);
    nodeG.attr('transform',d=>`translate(${d.x},${d.y})`);
  });
}

function nr(d){return Math.max(8,Math.min(28,5+d.weight*1.7))}

// ── Interaction ──
function highlight(n){
  const nbrs=new Set([n.id]);
  links.forEach(l=>{
    const s=l.source.id,t=l.target.id;
    if(s===n.id)nbrs.add(t);if(t===n.id)nbrs.add(s);
  });
  nodeG.transition().duration(200).style('opacity',d=>nbrs.has(d.id)?1:.12);
  link.transition().duration(200).style('opacity',d=>{
    const s=d.source.id,t=d.target.id;
    return(s===n.id||t===n.id)?.7:.03;
  }).attr('stroke-width',d=>{
    const s=d.source.id,t=d.target.id;
    return(s===n.id||t===n.id)?2.5+.8*(d.weight||1):.5;
  });
  linkLabel.transition().duration(200).attr('opacity',d=>{
    const s=d.source.id,t=d.target.id;
    return(s===n.id||t===n.id)?.8:0;
  });
  nodeG.select('.n-glow').transition().duration(200).attr('stroke-opacity',d=>d.id===n.id?.4:.1);
}
function clearHL(){
  nodeG.transition().duration(300).style('opacity',1);
  link.transition().duration(300).style('opacity',null);
  linkLabel.transition().duration(300).attr('opacity',0);
  nodeG.select('.n-glow').transition().duration(300).attr('stroke-opacity',.15);
}

// ── Panel ──
function openPanel(n){
  highlight(n);
  const rels = links.filter(l=>{
    const s=l.source.id||l.source,t=l.target.id||l.target;
    return s===n.id||t===n.id;
  }).sort((a,b)=>(b.weight||1)-(a.weight||1));

  const col = C[n.kind]?C[n.kind][0]:'#888';
  const col2 = C[n.kind]?C[n.kind][1]:'#aaa';

  let h = `<div class="kind-orb" style="color:${col};background:radial-gradient(circle,${col}22,transparent)">${C[n.kind]?C[n.kind][4]:'●'}</div>`;
  h += `<h2>${n.label}</h2>`;
  h += `<div class="latin-name">${n.id}</div>`;

  // Weight ring
  const pct = Math.min((n.weight||1)/10*100,100);
  h += `<div class="weight-ring"><svg width="80" height="80"><circle cx="40" cy="40" r="34" fill="none" stroke="rgba(201,169,97,.08)" stroke-width="3"/><circle cx="40" cy="40" r="34" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${pct*2.14} 214"/></svg><div class="val">${(n.weight||0).toFixed(1)}</div></div>`;

  if(rels.length){
    // Group by relation type
    const groups = {};
    rels.forEach(r=>{
      const type = r.relation;
      if(!groups[type])groups[type]=[];
      groups[type].push(r);
    });

    h += `<div class="section-title">Nexus · ${rels.length} Connections</div>`;
    Object.entries(groups).forEach(([type,rs])=>{
      h += `<div class="rel-group"><div class="rel-group-title">${type}</div>`;
      rs.slice(0,12).forEach(r=>{
        const isOut = (r.source.id||r.source)===n.id;
        const oid = isOut?(r.target.id||r.target):(r.source.id||r.source);
        const other = nodes.find(x=>x.id===oid);
        const oc = other?(C[other.kind]?C[other.kind][0]:'#666'):'#666';
        const os = other?(C[other.kind]?C[other.kind][4]:'●'):'●';
        h += `<div class="rel-item" onclick="jumpNode('${oid}')">
          <div class="mini-orb" style="color:${oc};border:1px solid ${oc}33">${os}</div>
          <div class="rel-text">${other?other.label:oid}</div>
          <div class="rel-type">${isOut?'→':'←'} ${type}</div>
        </div>`;
      });
      if(rs.length>12)h += `<div style="font-size:10px;color:var(--gold-dim);padding:4px 10px;opacity:.6">...+${rs.length-12} more</div>`;
      h += `</div>`;
    });
  }

  document.getElementById('panel-c').innerHTML=h;
  document.getElementById('panel').classList.add('open');
}
function closePanel(){document.getElementById('panel').classList.remove('open');clearHL()}
function jumpNode(id){const n=nodes.find(x=>x.id===id);if(n)openPanel(n)}

// ── Filters ──
document.querySelectorAll('.filter-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    const k=b.dataset.k;
    if(b.classList.contains('active')){b.classList.remove('active');activeK.delete(k)}
    else{b.classList.add('active');activeK.add(k)}
    render();
  });
});

// ── Search ──
document.getElementById('search').addEventListener('input',function(){
  const q=this.value.trim().toLowerCase();
  if(!q){clearHL();return}
  const m=nodes.filter(n=>n.label.toLowerCase().includes(q)||n.id.toLowerCase().includes(q));
  if(m.length===1){openPanel(m[0]);centerNode(m[0])}
  else{
    const ids=new Set(m.map(n=>n.id));
    nodeG.transition().duration(200).style('opacity',d=>ids.has(d.id)?1:.08);
    link.transition().duration(200).style('opacity',.02);
  }
});

function centerNode(n){
  if(n.x==null)return;
  const t=d3.zoomIdentity.translate(W()/2,H()/2).scale(1.4).translate(-n.x,-n.y);
  svg.transition().duration(800).call(zoom.transform,t);
}

// ── Controls ──
function zoomIn(){svg.transition().duration(300).call(zoom.scaleBy,1.5)}
function zoomOut(){svg.transition().duration(300).call(zoom.scaleBy,0.67)}
function resetView(){svg.transition().duration(600).call(zoom.transform,d3.zoomIdentity)}
function togglePhysics(){
  physicsOn=!physicsOn;
  if(physicsOn)sim.alphaTarget(.3).restart();else sim.stop();
}

// ── Tooltip ──
const tip=document.getElementById('tooltip');
function showTip(e,l,c){tip.innerHTML=`<div class="ttl">${l}</div><div class="cat">${c}</div>`;tip.style.opacity=1;tip.style.left=(e.clientX+16)+'px';tip.style.top=(e.clientY-10)+'px'}
function hideTip(){tip.style.opacity=0}

// ── Resize ──
window.addEventListener('resize',()=>{
  if(sim)sim.force('center',d3.forceCenter(W()/2,H()/2)).alpha(.2).restart();
});

// ── Load ──
async function load(){
  try{
    const r=await fetch('/api/graph');
    const d=await r.json();
    const gd=(d.nodes&&d.edges)?d:{nodes:[],edges:[]};

    nodes=gd.nodes.map(n=>({...n}));
    links=gd.edges.map(l=>({...l}));

    document.getElementById('s-nodes').textContent=nodes.length;
    document.getElementById('s-edges').textContent=links.length;
    document.getElementById('s-types').textContent=new Set(nodes.map(n=>n.kind)).size;

    setTimeout(()=>{
      document.getElementById('loading').classList.add('hide');
      initGraph();
      render();
    },400);
  }catch(err){
    document.getElementById('loading').innerHTML=`<div style="text-align:center;max-width:340px;padding:40px">
      <div style="font-size:48px;color:var(--gold);margin-bottom:16px">✦</div>
      <p style="font-family:'Cinzel',serif;color:var(--gold-bright);font-size:16px;margin-bottom:8px">The Codex Awaits</p>
      <p style="font-size:13px;color:var(--gold-dim);line-height:1.6">${err.message}</p>
      <p style="font-size:11px;color:var(--gold-dim);opacity:.5;margin-top:16px">lens view --data-dir ./demo_data</p>
    </div>`;
  }
}
load();
</script>
</body>
