name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt -p lens -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy -p lens --all-targets -- -D warnings
      - name: Tests (unit + scenario + proxy e2e)
        run: cargo test -p lens
      - name: Desktop shell compiles (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo check -p lens-desktop
      - name: Generated TS bindings must be fresh
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code frontend/src/generated/
      - name: Dependency vulnerability scan
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-audit --locked || true
          cargo audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build
      - name: Committed web assets must match the build
        working-directory: .
        run: git diff --exit-code web/
